# Sample ros2_control controller configuration for the Isaac-hosted
# ControllerManager (Isaac Sim "isaacsim.ros2.control" route), reBot B601-RS
# arm group. The action server this adapter drives is
# /rebot_arm_rs_isaac_trajectory_controller/follow_joint_trajectory, matching
# examples/robot_adapters/profiles/rebot-b601-rs.json transport.simulation.command.
#
# Bring-up order on the Isaac side (see docs/ISAAC_ROS2_ADAPTER.md):
#   1. Load the reBot USD articulation (profile joint names joint1..joint6).
#   2. Start the /clock publisher (bridge clock graph) -- use_sim_time is true.
#   3. Ros2ControlManager.setup(prim_path, this_file, namespace="")
#   4. Activate via the controller_manager service:
#      ros2 service call /controller_manager/switch_controller
#        controller_manager_msgs/srv/SwitchController
#        "{activate_controllers: [joint_state_broadcaster, rebot_arm_rs_isaac_trajectory_controller]}"
controller_manager:
  ros__parameters:
    update_rate: 60
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    rebot_arm_rs_isaac_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

rebot_arm_rs_isaac_trajectory_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
    gains: {}
