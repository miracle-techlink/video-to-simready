<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200" font-family="'Noto Sans CJK SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1440" height="1200" fill="#f8fafc"/>

  <text x="60" y="58" font-size="34" font-weight="700" fill="#0f172a">simready 分层架构（real-to-sim 基础设施）</text>
  <text x="60" y="92" font-size="19" fill="#475569">职责分层与产物流转示意 · 精确代码依赖以 configs/architecture/module_boundaries.json 为准</text>

  <!-- Layer 1: entry / inputs -->
  <text x="60" y="138" font-size="20" fill="#64748b">入口与输入</text>
  <rect x="60" y="150" width="420" height="92" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="80" y="184" font-size="24" font-weight="700" fill="#0c4a6e">simready CLI（唯一入口）</text>
  <text x="80" y="218" font-size="19" fill="#075985">统一命令 · 配置分发</text>

  <rect x="510" y="150" width="420" height="92" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="530" y="184" font-size="24" font-weight="700" fill="#0c4a6e">输入</text>
  <text x="530" y="218" font-size="19" fill="#075985">视频/图像 · pipeline.json · 场景与任务声明</text>

  <rect x="960" y="150" width="420" height="92" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="980" y="184" font-size="24" font-weight="700" fill="#0c4a6e">配置与合同</text>
  <text x="980" y="218" font-size="19" fill="#075985">冻结引用（hash）· 阈值 · 架构边界合同</text>

  <!-- entry -> orchestration (dashed = call) -->
  <line x1="270" y1="242" x2="270" y2="292" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowDash)"/>

  <!-- Layer 2: orchestration -->
  <rect x="60" y="296" width="1320" height="104" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="80" y="336" font-size="26" font-weight="700" fill="#4c1d95">workflows — 编排层</text>
  <text x="80" y="376" font-size="22" fill="#5b21b6">pipeline 计划与阶段恢复 · baseline 矩阵对比 · benchmark suite 编排与聚合</text>

  <!-- orchestration trunk to each functional card (dashed = call) -->
  <line x1="720" y1="400" x2="720" y2="432" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6"/>
  <line x1="212" y1="432" x2="1228" y2="432" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6"/>
  <line x1="212" y1="432" x2="212" y2="464" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowDash)"/>
  <line x1="551" y1="432" x2="551" y2="464" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowDash)"/>
  <line x1="890" y1="432" x2="890" y2="464" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowDash)"/>
  <line x1="1228" y1="432" x2="1228" y2="464" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowDash)"/>

  <!-- Layer 3: functional domains (4 equal cards) -->

  <rect x="60" y="468" width="304" height="252" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="80" y="506" font-size="28" font-weight="700" fill="#14532d">ingestion</text>
  <text x="80" y="544" font-size="22" fill="#166534">多后端重建适配</text>
  <text x="80" y="578" font-size="22" fill="#166534">导入 / 命令 / Aholo</text>
  <text x="80" y="612" font-size="22" fill="#166534">视频抽帧与观测提取</text>
  <text x="80" y="646" font-size="22" fill="#166534">文本定位分割（DINO+SAM）</text>
  <rect x="76" y="672" width="272" height="34" rx="6" fill="#bbf7d0" opacity="0.7"/>
  <text x="88" y="696" font-size="19" fill="#14532d">输出：重建 bundle · mask</text>

  <rect x="399" y="468" width="304" height="252" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="419" y="506" font-size="28" font-weight="700" fill="#713f12">assets</text>
  <text x="419" y="544" font-size="22" fill="#854d0e">语义关联与遮挡剔除</text>
  <text x="419" y="578" font-size="22" fill="#854d0e">外观与物理声明</text>
  <text x="419" y="612" font-size="22" fill="#854d0e">CPU 场景编译与碰撞几何</text>
  <rect x="415" y="672" width="272" height="34" rx="6" fill="#fef08a" opacity="0.8"/>
  <text x="427" y="696" font-size="19" fill="#713f12">输出：USD 场景资产</text>

  <rect x="738" y="468" width="304" height="252" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="758" y="506" font-size="28" font-weight="700" fill="#1e3a8a">simulation</text>
  <text x="758" y="544" font-size="22" fill="#1e40af">Isaac 环境与标定观测</text>
  <text x="758" y="578" font-size="22" fill="#1e40af">固定相机 RGBD 采集</text>
  <text x="758" y="612" font-size="22" fill="#1e40af">物理探针与巡览渲染</text>
  <rect x="754" y="672" width="272" height="34" rx="6" fill="#bfdbfe" opacity="0.8"/>
  <text x="766" y="696" font-size="19" fill="#1e3a8a">输出：RGBD 观测 + 回执</text>

  <rect x="1077" y="468" width="303" height="252" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="1097" y="506" font-size="28" font-weight="700" fill="#831843">evaluation</text>
  <text x="1097" y="544" font-size="22" fill="#9d174d">候选场景独立评分</text>
  <text x="1097" y="578" font-size="22" fill="#9d174d">指标核验与失败反例</text>
  <text x="1097" y="612" font-size="22" fill="#9d174d">只读冻结产物 · 不写资产</text>
  <rect x="1083" y="672" width="271" height="34" rx="6" fill="#fbcfe8" opacity="0.8"/>
  <text x="1095" y="696" font-size="19" fill="#831843">输出：评分与验收报告</text>

  <!-- product flow arrows (solid) between functional cards -->
  <line x1="364" y1="594" x2="395" y2="594" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="703" y1="594" x2="734" y2="594" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1042" y1="594" x2="1073" y2="594" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Layer 4: execution support (duties only, no arrows) -->
  <text x="60" y="764" font-size="20" fill="#64748b">执行支撑</text>
  <rect x="60" y="776" width="1320" height="92" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="80" y="814" font-size="26" font-weight="700" fill="#7c2d12">execution — 进程 / 容器 / 期限 / GPU 租约 / 工件缓存</text>
  <text x="80" y="850" font-size="22" fill="#9a3412">本地与容器执行 · 取消与恢复 · 资源调度 · 任务图与结果缓存</text>

  <!-- Layer 5: foundation (independent, no cross link) -->
  <text x="60" y="916" font-size="20" fill="#64748b">基础层（两者相互独立）</text>
  <rect x="60" y="928" width="648" height="96" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="80" y="966" font-size="26" font-weight="700" fill="#0f172a">core — 合同 / 证据 / 类型</text>
  <text x="80" y="1002" font-size="22" fill="#334155">hash 冻结引用 · JSON IO · 基础校验</text>

  <rect x="732" y="928" width="648" height="96" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="752" y="966" font-size="26" font-weight="700" fill="#0f172a">geometry — 坐标 / 相机 / 投影</text>
  <text x="752" y="1002" font-size="22" fill="#334155">坐标约定 · 变换校验 · 纯投影几何</text>

  <!-- legend & notes -->
  <line x1="60" y1="1056" x2="1380" y2="1056" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="60" y1="1086" x2="120" y2="1086" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="134" y="1093" font-size="19" fill="#334155">实线箭头 = 功能层之间冻结产物流转（ingestion → assets → simulation → evaluation）</text>
  <line x1="60" y1="1120" x2="120" y2="1120" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowDash)"/>
  <text x="134" y="1127" font-size="19" fill="#334155">虚线箭头 = 编排与调用（CLI → workflows → 各功能域）</text>
  <text x="60" y="1164" font-size="19" fill="#475569">evaluation 独立读回；core 与 geometry 相互独立。精确依赖见架构合同。</text>
</svg>
